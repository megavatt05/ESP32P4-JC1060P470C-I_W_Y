# ============================================================================
#  Манифест менеджера компонентов ESP-IDF (idf_component.yml)
# ----------------------------------------------------------------------------
#  Здесь перечислены внешние зависимости проекта. ВНИМАНИЕ: все эти компоненты
#  УЖЕ скачаны и пропатчены под плату в папке components/ — при наличии
#  интернет-связи менеджер сверит версии, без интернета сборка использует
#  локальные копии (зависимости.lock фиксирует точные версии).
#
#  Версии обозначаются так: '*' — любая, '0.4.*' — любая ветка 0.4, '^0.2.0' —
#  0.2.0 и выше в пределах мажорной версии.
# ============================================================================
dependencies:
  # Wi-Fi-драйвер для чипов без радиотракта: перенаправляет вызовы Wi-Fi
  # на слейв ESP32-C6 (на плате JC1060P470C радиомодуль именно там)
  espressif/esp_wifi_remote:
    version: '*'
  # Транспорт ESP-Hosted: связь P4 <-> C6 по SDIO (данные Wi-Fi/BLE)
  # ВНИМАНИЕ: версия закреплена жёстко (!) под заводскую прошивку
  # сопроцессора ESP32-C6, установленную на плате, — она имеет версию 2.3.2.
  # Компонент esp_hosted 3.x (требует IDF >= 5.5) с прошивкой 2.3.2
  # НЕСОВМЕСТИМ: в логе печатается "eh_init_evt: major version mismatch",
  # связь работает в деградировавшем режиме и Wi-Fi не подключается
  # (отвал по reason=203). Без закрепления менеджер компонентов выбирает
  # новейший 3.0.8 (вышел 24.09.2026) именно из-за требования IDF >= 5.5.
  # 2.12.13 — последняя версия ветки 2.x (поддерживает IDF >= 5.3),
  # протокольно совместима с заводской прошивкой C6.
  # Если когда-нибудь обновите прошивку C6 до ветки 3.x — поднимите версию
  # здесь, предварительно удалив managed_components/ и dependencies.lock.
  espressif/esp_hosted:
    version: '2.12.13'

  # UI-фреймворк "Phone" от Espressif — домашний экран в стиле Android.
  # Ветка 0.4.x (проверена на 0.4.1)
  espressif/esp-brookesia:
    version: 0.4.*

  # Видеоконвейер: захват и обработка потока с камеры (MIPI-CSI)
  espressif/esp_video:
    version: '*'
  # Драйвер экрана JC1060P470C — микросхема JD9165 (MIPI-DSI, 1024x600)
  esp_lcd_jd9165: '*'
  # Оценка заряда батареи по АЦП (индикатор в приложении Settings)
  espressif/adc_battery_estimation: ^0.2.0
  # Проигрыватель AVI/MJPEG — используется видеоплеером с SD-карты
  espressif/avi_player: ^2.0.0
