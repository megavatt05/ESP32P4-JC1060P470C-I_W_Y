# ============================================================================
#  Манифест менеджера компонентов ESP-IDF (idf_component.yml)
# ----------------------------------------------------------------------------
#  Единственная внешняя зависимость — драйвер панельной микросхемы JD9165.
#  Менеджер скачает её при первой сборке (нужен интернет) и зафиксирует
#  точную версию в dependencies.lock.
#
#  Версия "^2.0.2" = 2.0.2 и выше в пределах мажорной версии 2.
#  Именно v2.0.2 была проверена на этой плате (см. лог демо: "jd9165: version: 2.0.2").
# ============================================================================
dependencies:
  idf: ">=5.3"                          # MIPI-DSI API доступен с IDF 5.3
  espressif/esp_lcd_jd9165: "^2.0.2"    # драйвер панели JD9165 (MIPI-DSI)
